{% extends 'dunia_app/base.html' %}

{% block title %}Modifier un objectif · Dunia{% endblock %}

{% block content %}
<main class="mx-auto max-w-2xl px-4 py-10">
  <a class="link link-primary text-sm" href="{% url 'tableau_bord' %}#objectifs">← Retour à mon espace</a>
  <section class="card mt-5 border border-base-300 bg-base-100 shadow-lg">
    <div class="card-body p-6 sm:p-9">
      <h1 class="text-2xl font-bold">Modifier mon objectif</h1>
      <p class="text-sm text-base-content/65">Ajustez votre prochaine étape d’apprentissage.</p>
      <form method="post" class="mt-3 space-y-4">
        {% csrf_token %}
        {% for field in form %}<label class="form-control"><span class="label-text mb-1 text-sm font-medium">{{ field.label }}</span>{{ field }}{% if field.help_text %}<span class="text-xs text-base-content/60">{{ field.help_text }}</span>{% endif %}{% for error in field.errors %}<span class="text-sm text-error">{{ error }}</span>{% endfor %}</label>{% endfor %}
        <div class="flex flex-wrap gap-2"><button class="btn btn-primary rounded-xl" type="submit">Enregistrer</button><a class="btn btn-ghost rounded-xl" href="{% url 'tableau_bord' %}#objectifs">Annuler</a></div>
      </form>
    </div>
  </section>
</main>
{% endblock %}
