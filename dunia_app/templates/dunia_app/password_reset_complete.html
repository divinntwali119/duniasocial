{% extends 'dunia_app/base.html' %}

{% block title %}Mot de passe modifié · Dunia{% endblock %}

{% block content %}
<main class="min-h-[60vh] px-4 py-16">
  <section class="card mx-auto max-w-xl border border-base-300 bg-base-100 shadow-lg">
    <div class="card-body items-center gap-4 p-8 text-center">
      <div class="grid h-16 w-16 place-items-center rounded-2xl bg-success/10 text-success" aria-hidden="true"><svg viewBox="0 0 24 24" class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="m5 12 4 4L19 6"/></svg></div>
      <h1 class="text-3xl font-bold">Mot de passe mis à jour</h1>
      <p class="text-base-content/70">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
      <a class="btn btn-primary rounded-xl" href="{% url 'connexion' %}">Se connecter</a>
    </div>
  </section>
</main>
{% endblock %}
