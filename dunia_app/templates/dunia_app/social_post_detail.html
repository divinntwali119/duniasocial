{% extends 'dunia_app/base.html' %}

{% block title %}Publication de {{ post.auteur.get_full_name|default:post.auteur.username }} · Dunia{% endblock %}

{% block content %}
<main class="mx-auto max-w-2xl space-y-4 px-3 py-5 pb-28 sm:px-5 sm:py-8">
  <a href="{% url 'home' %}" class="btn btn-ghost min-h-11 rounded-xl">← Retour au fil</a>
  {% include 'dunia_app/partials/feed_card.html' with item=post item_type='post' %}
</main>
{% endblock %}
