{% extends 'dunia_app/base.html' %}

{% block title %}Instructions envoyées · Dunia{% endblock %}

{% block content %}
<main class="min-h-[60vh] px-4 py-16">
  <section class="card mx-auto max-w-xl border border-base-300 bg-base-100 shadow-lg">
    <div class="card-body items-center gap-4 p-8 text-center">
      <div class="grid h-16 w-16 place-items-center rounded-2xl bg-primary/10 text-primary" aria-hidden="true"><svg viewBox="0 0 24 24" class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="m4 7 8 6 8-6"/></svg></div>
      <h1 class="text-3xl font-bold">Vérifiez votre boîte e-mail</h1>
      <p class="text-base-content/70">Si un compte correspond à cette adresse, les instructions de réinitialisation viennent d’être envoyées.</p>
      <a class="btn btn-primary rounded-xl" href="{% url 'connexion' %}">Retour à la connexion</a>
    </div>
  </section>
</main>
{% endblock %}
